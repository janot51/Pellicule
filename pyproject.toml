[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pellicule"
version = "0.1.0"
description = "Film local des couches d'un harness d'agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
pellicule = "pellicule.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pellicule"]
